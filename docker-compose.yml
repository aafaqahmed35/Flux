services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: flux-app
    restart: unless-stopped
    ports:
      - "${PORT:-18082}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - APP_NAME=${APP_NAME:-Flux}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=${TZ:-UTC}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-flux_db}
      - POSTGRES_USER=${POSTGRES_USER:-flux_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flux_password}
      - POSTGRES_MAX_CONNECTIONS=${POSTGRES_MAX_CONNECTIONS:-20}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: flux-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-15433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flux_db}
      POSTGRES_USER: ${POSTGRES_USER:-flux_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flux_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flux_user} -d ${POSTGRES_DB:-flux_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flux-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: flux-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-18086}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: flux_postgres_data
  redis_data:
    name: flux_redis_data
