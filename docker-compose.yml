services:
  flux-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flux-api
    restart: unless-stopped
    command: npm run start:api
    ports:
      - "${PORT:-18082}:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - APP_NAME=Flux
      - APP_VERSION=1.0.0
      - LOG_LEVEL=info
      - POSTGRES_HOST=flux-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-flux_db}
      - POSTGRES_USER=${POSTGRES_USER:-flux_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flux_password}
      - REDIS_HOST=flux-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - OTEL_SERVICE_NAME=flux-api
    networks:
      - flux-network
    depends_on:
      flux-postgres:
        condition: service_healthy
      flux-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  flux-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flux-worker
    restart: unless-stopped
    command: npm run start:worker
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=info
      - POSTGRES_HOST=flux-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-flux_db}
      - POSTGRES_USER=${POSTGRES_USER:-flux_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flux_password}
      - REDIS_HOST=flux-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - WORKER_CONCURRENCY=5
      - OTEL_SERVICE_NAME=flux-worker
    networks:
      - flux-network
    depends_on:
      flux-postgres:
        condition: service_healthy
      flux-redis:
        condition: service_healthy

  flux-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flux-scheduler
    restart: unless-stopped
    command: npm run start:scheduler
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=info
      - POSTGRES_HOST=flux-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-flux_db}
      - POSTGRES_USER=${POSTGRES_USER:-flux_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flux_password}
      - REDIS_HOST=flux-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SCHEDULER_POLL_INTERVAL_MS=5000
      - OTEL_SERVICE_NAME=flux-scheduler
    networks:
      - flux-network
    depends_on:
      flux-postgres:
        condition: service_healthy
      flux-redis:
        condition: service_healthy

  flux-recovery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flux-recovery
    restart: unless-stopped
    command: npm run start:recovery
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=info
      - POSTGRES_HOST=flux-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-flux_db}
      - POSTGRES_USER=${POSTGRES_USER:-flux_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flux_password}
      - REDIS_HOST=flux-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - OTEL_SERVICE_NAME=flux-recovery
    networks:
      - flux-network
    depends_on:
      flux-postgres:
        condition: service_healthy
      flux-redis:
        condition: service_healthy


  flux-postgres:
    image: postgres:16-alpine
    container_name: flux-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-15433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flux_db}
      POSTGRES_USER: ${POSTGRES_USER:-flux_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flux_password}
    volumes:
      - flux-postgres-data:/var/lib/postgresql/data
    networks:
      - flux-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flux_user} -d ${POSTGRES_DB:-flux_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  flux-redis:
    image: redis:7-alpine
    container_name: flux-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - flux-redis-data:/data
    networks:
      - flux-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  flux-adminer:
    image: adminer:latest
    container_name: flux-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-18086}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: flux-postgres
    networks:
      - flux-network
    depends_on:
      flux-postgres:
        condition: service_healthy

networks:
  flux-network:
    name: flux_network

volumes:
  flux-postgres-data:
    name: flux_postgres_data
  flux-redis-data:
    name: flux_redis_data
