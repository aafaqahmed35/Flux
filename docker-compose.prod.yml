services:
  flux-api:
    image: flux:latest
    container_name: flux-api
    restart: always
    command: npm run start:api
    ports:
      - "${PORT:-18082}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_NAME=Flux
      - APP_VERSION=1.0.0
      - LOG_LEVEL=info
      - POSTGRES_HOST=flux-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=flux-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - AUTH_ENABLED=true
      - JWT_SECRET=${JWT_SECRET}
      - OTEL_SERVICE_NAME=flux-api
    networks:
      - flux-network
    depends_on:
      flux-postgres:
        condition: service_healthy
      flux-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  flux-worker:
    image: flux:latest
    container_name: flux-worker
    restart: always
    command: npm run start:worker
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - POSTGRES_HOST=flux-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=flux-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - WORKER_CONCURRENCY=10
      - OTEL_SERVICE_NAME=flux-worker
    networks:
      - flux-network
    depends_on:
      flux-postgres:
        condition: service_healthy
      flux-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  flux-scheduler:
    image: flux:latest
    container_name: flux-scheduler
    restart: always
    command: npm run start:scheduler
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - POSTGRES_HOST=flux-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=flux-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SCHEDULER_POLL_INTERVAL_MS=5000
      - OTEL_SERVICE_NAME=flux-scheduler
    networks:
      - flux-network
    depends_on:
      flux-postgres:
        condition: service_healthy
      flux-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  flux-postgres:
    image: postgres:16-alpine
    container_name: flux-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - flux-postgres-data:/var/lib/postgresql/data
    networks:
      - flux-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  flux-redis:
    image: redis:7-alpine
    container_name: flux-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - flux-redis-data:/data
    networks:
      - flux-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  flux-network:
    name: flux_network_prod

volumes:
  flux-postgres-data:
    name: flux_postgres_data_prod
  flux-redis-data:
    name: flux_redis_data_prod
